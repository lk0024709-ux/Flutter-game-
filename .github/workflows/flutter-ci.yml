name: Flutter CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing Android runner files
        run: flutter create --platforms=android --project-name blade_brawl .
      - name: Install dependencies
        run: flutter pub get
      # The three steps below tee their output and re-emit every diagnostic as a
      # check annotation. The raw job log lives on a host that automation cannot
      # always reach, while annotations are available through the API, so a red
      # build explains itself without opening GitHub.
      - name: Analyze
        shell: bash
        run: |
          set +e
          output_file="$(mktemp)"
          flutter analyze 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E ' • ' "$output_file" > "$output_file.issues" || true
            total=$(wc -l < "$output_file.issues")
            printf '::error title=flutter analyze::%s\n' "total diagnostics: $total"
            # Every issue as its own annotation, then the whole list again in
            # batches of eight so the count cannot hide behind a display limit.
            sed 's/%/%25/g' "$output_file.issues" | while IFS= read -r line; do
              printf '::error title=analyze::%s\n' "${line:0:900}"
            done
            awk 'BEGIN{RS="\n"} {gsub(/%/,"%25"); buf=buf $0 " | "; n++; if (n==8) {printf "::error title=analyze batch::%s\n", substr(buf,1,900); buf=""; n=0}} END{if (n>0) printf "::error title=analyze batch::%s\n", substr(buf,1,900)}' "$output_file.issues"
            rm -f "$output_file.issues"
          fi
          rm -f "$output_file"
          exit "$status"
      - name: Unit tests
        shell: bash
        run: |
          set +e
          output_file="$(mktemp)"
          flutter test 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 60 "$output_file" | while IFS= read -r line; do
              printf '::error title=flutter test::%s\n' "${line:0:900}"
            done
          fi
          rm -f "$output_file"
          exit "$status"
      - name: Build debug APK
        shell: bash
        run: |
          set +e
          output_file="$(mktemp)"
          flutter build apk --debug 2>&1 | tee "$output_file"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -nE "(Error|error:|Exception)" "$output_file" | head -n 40 | while IFS= read -r line; do
              printf '::error title=flutter build::%s\n' "${line:0:900}"
            done
          fi
          rm -f "$output_file"
          exit "$status"
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blade-brawl-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

<!DOCTYPE html>
<html>
<head>
  <base href="/Flutter-game-/">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="description" content="Battle of Sword Master — forge your weapons and conquer a procedural 3D arena.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#F5F1EA">
  <title>Battle of Sword Master</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { height: 100%; margin: 0; background: #F5F1EA; }
    body { overflow: hidden; }
    #loading { display: grid; place-items: center; width: 100%; height: 100%; color: #78716C; font-family: system-ui, sans-serif; }
  </style>
</head>
<body>
  <div id="loading">Sharpening the blades…</div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
</body>
</html>
